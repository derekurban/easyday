<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.board{display:grid;gap:34px}
.dir h3{font:600 15px var(--font-sans);margin:0 0 3px;color:var(--foreground)}
.dir h3 span{font-family:var(--font-mono);font-weight:500;color:var(--muted-foreground);margin-right:8px}
.dir p{font:400 13px/1.5 var(--font-sans);color:var(--muted-foreground);margin:0 0 12px;max-width:640px}
.pair{display:flex;flex-wrap:wrap;gap:16px}
.phone{zoom:.87;width:390px;height:844px;position:relative;overflow:hidden;border-radius:36px;background:var(--bg);color:var(--ink);
  font-family:'Wix Madefor Text',system-ui,sans-serif;font-size:15px;line-height:1.35;outline:1px solid rgba(128,128,128,.35);outline-offset:-1px}
.phone *{box-sizing:border-box}
.phone svg{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sky{position:absolute;inset:0 0 auto 0;height:340px;background:var(--sky);display:none}
.sun{position:absolute;width:140px;height:70px;border-radius:70px 70px 0 0;right:-30px;top:105px;background:linear-gradient(180deg,#FFE38C,#FDB582 80%,#FB9A86);display:none}
.has-sky .sky{display:block}
.body{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;color:var(--head)}
.top b{font:500 20px 'Albert Sans',sans-serif}
.place{display:flex;gap:6px;align-items:center;color:var(--headlink);font-weight:500;font-size:14.5px}
h1{font:var(--tw) var(--ts)/1.1 'Albert Sans',sans-serif;letter-spacing:-.9px;margin:14px 20px 8px;color:var(--head)}
.facts{margin:0 20px;font-size:14.5px;display:flex;gap:7px;align-items:center;color:var(--head);font-weight:500}
.stats{margin:2px 20px 0;display:flex;gap:8px}
.stats div{flex:1;background:var(--surface);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.stats b{display:block;font:700 24px/1.1 'Albert Sans',sans-serif;color:var(--ink);letter-spacing:-.5px}
.card{background:var(--surface);border-radius:var(--r);border:var(--cb);box-shadow:var(--cs)}
.rank{margin:14px 20px 0;padding:14px 16px;position:relative}
.rank .row{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--bronze);background:var(--bronzebg);padding:3px 9px 3px 7px;border-radius:999px}
.rank .n{font:600 22px 'Albert Sans',sans-serif;letter-spacing:-.4px}
.rank .to{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;width:62%;border-radius:3px;background:var(--bar)}
.fig{margin:12px 20px 0;padding:14px 16px 12px;background:var(--figbg);border-radius:var(--r);border:var(--cb);box-shadow:var(--cs)}
.fig img{display:block;height:118px;margin:0 auto 10px}
.fig .cap{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2)}
.link{color:var(--link);font-weight:500}
.planh{margin:18px 20px 8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2)}
.planh span{display:flex;gap:7px;align-items:center}
.plan{margin:0 20px;overflow:hidden}
.plan .rowp{display:flex;align-items:center;gap:13px;padding:13px 14px;border-top:1px solid var(--line)}
.plan .rowp:first-child{border-top:0}
.plan .rowp > svg:first-child{color:var(--ink2)}
.plan .nm{flex:1;min-width:0}
.plan .nm b{display:block;font-weight:500;font-size:15.5px}
.plan .nm small{font-size:12.5px;color:var(--ink2)}
.plan .mn{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.split .plan{background:none;border:0;box-shadow:none;display:grid;gap:8px;overflow:visible}
.split .plan .rowp{background:var(--surface);border-radius:var(--r);border:var(--cb);box-shadow:var(--cs)}
.dock{position:absolute;left:0;right:0;bottom:64px;background:var(--dockbg);border-top:1px solid var(--line);padding:12px 20px 14px}
.dock .lr{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:13.5px;color:var(--ink2)}
.dock .lr > span:first-child{width:46px}
.seg{flex:1;display:flex;background:var(--segbg);border-radius:var(--segr);padding:var(--segpad);border:var(--segb)}
.seg span{flex:1;text-align:center;padding:8px 0;border-radius:calc(var(--segr) - 2px);color:var(--ink);font-weight:500;font-size:14px}
.seg .on{background:var(--segon);color:var(--segonink);box-shadow:var(--segs)}
.slider{flex:1;height:6px;border-radius:3px;background:var(--track);position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;width:26%;border-radius:3px;background:var(--fill)}
.slider u{position:absolute;left:26%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--thumb);box-shadow:var(--thumbs)}
.mins{color:var(--link);font-weight:500;font-size:15px}
.btn{height:54px;border-radius:var(--br);background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15.5px;box-shadow:var(--btns)}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--navbg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:11.5px;color:var(--ink2)}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav .on{color:var(--navon)}
.nav .on svg{background:var(--navpill);border-radius:999px;padding:var(--navpad);width:var(--navw);box-sizing:content-box}

.statsi{display:flex;gap:24px;margin:4px 20px 0;color:var(--head)}
.statsi b{display:block;font:700 27px/1.05 'Albert Sans',sans-serif;letter-spacing:-.6px}
.statsi span{font-size:12px;color:var(--head);opacity:.72}
.rankwrap{position:relative;margin-top:14px}
.rankwrap .rank{margin-top:0}
.suncut{position:absolute;right:0;bottom:100%;width:190px;height:150px;overflow:hidden;margin-bottom:-1px}
.orb{position:absolute;width:var(--sd);height:var(--sd);right:var(--sx);bottom:calc(var(--sy) - var(--sd) / 2);border-radius:50%;background:var(--orb)}
.moon .orb{background:none;box-shadow:inset -13px 5px 0 0 var(--moon)}
.phone.crop{height:318px;border-radius:36px 36px 0 0}
.phone.crop .dock,.phone.crop .nav{display:none}
.times{display:grid;gap:22px}
.times h4{font:600 13px var(--font-sans);color:var(--foreground);margin:0 0 8px}
.times h4 span{font-weight:400;color:var(--muted-foreground);margin-left:8px}
.cols{display:flex;gap:16px;font:500 12px var(--font-sans);color:var(--muted-foreground);margin:0 0 6px}
.cols span{width:339px}
</style></head><body>
<img id="f-blue" src="figure-blue.png" alt="" hidden><img id="f-sun" src="figure-sun.png" alt="" hidden><img id="f-coral" src="figure-coral.png" alt="" hidden><img id="f-navy" src="figure-navy.png" alt="" hidden>
<div class="board" id="board"></div>
<script>
const P = 'file:///';
const I = {
  place: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
  bell: '<path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  weight: '<circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  shuffle: '<path d="m18 14 4 4-4 4M18 2l4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22M2 6h1.972a4 4 0 0 1 3.6 2.2M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/>',
  list: '<path d="M10 6h11M10 12h11M10 18h11"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  cal: '<path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
  trend: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  sliders: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${I[n]}</svg>`;

const base = {tw: 500, ts: '34px', r: '14px', cb: 'none', cs: 'none', segr: '12px', segpad: '3px', segb: 'none', segs: 'none', br: '14px', btns: 'none',
  thumbs: '0 1px 4px rgba(0,0,0,.25)', navpill: 'transparent', navpad: '0', navw: '22px', bronze: '#B0763C', bronzebg: 'rgba(176,118,60,.14)', sky: 'none'};


const SUN = 'linear-gradient(180deg,#FFE38C,#FDB582 80%,#FB9A86)';
// Night sun's colours: a warm white page with white cards, or true black; ink and the sun are the only colours
const L = {bg:'#FBF8F3',surface:'#FFFFFF',figbg:'#FFFFFF',line:'#ECE5DB',ink:'#14110F',ink2:'#72665D',head:'#14110F',headlink:'#14110F',link:'#14110F',r:'24px',tw:700,ts:'37px',
  cs:'0 1px 2px rgba(80,50,20,.05),0 6px 16px rgba(80,50,20,.07)',track:'#E6DED3',bar:'#B0763C',segbg:'#EEE7DD',segr:'16px',segon:'#FFFFFF',segonink:'#14110F',segs:'0 1px 3px rgba(80,50,20,.12)',
  fill:'#14110F',thumb:'#FFFFFF',btn:SUN,btnink:'#3A1A0C',btns:'0 6px 16px rgba(251,154,134,.35)',br:'27px',dockbg:'#FBF8F3',navbg:'#FFFFFF',navon:'#14110F'};
const D = {bg:'#000000',surface:'#151416',figbg:'#151416',line:'#252326',ink:'#FFFFFF',ink2:'#A09CA3',head:'#FFFFFF',headlink:'#FFFFFF',link:'#FFFFFF',r:'24px',tw:700,ts:'37px',
  track:'#2C2A2E',bar:'#C58A4E',segbg:'#151416',segr:'16px',segon:'#2E2C30',segonink:'#FFFFFF',fill:'#FFFFFF',thumb:'#FFFFFF',btn:SUN,btnink:'#3A1A0C',br:'27px',dockbg:'#000000',navbg:'#000000',navon:'#FFFFFF'};
const sky = (a, b, c, page) => `linear-gradient(180deg,${a} 0%,${b} 46%,${c} 74%,${page} 100%)`;
// each time of day: the sky top, middle and horizon for the light and the dark theme, then the sun's size, height and colour
const times = [
 {key: 'dawn', name: 'Dawn', at: '6:00', note: 'the sun just clears the horizon',
  light: ['#B7C2F2', '#DCCDEB', '#F8D2C0'], dark: ['#1E1670', '#5A3BB5', '#A0527F'], sd: '150px', sy: '-28px', sx: '-30px', orb: 'linear-gradient(180deg,#FFD98A,#FBA07A 60%,#F58A7E)'},
 {key: 'morning', name: 'Morning', at: '9:00', note: 'most of the sun is up',
  light: ['#86C5FA', '#C6E1F8', '#FBE6CE'], dark: ['#123C88', '#2E6DC2', '#6C74B8'], sd: '140px', sy: '26px', sx: '-30px', orb: SUN},
 {key: 'midday', name: 'Midday', at: '13:00', note: 'a small bright sun, high',
  light: ['#6DB7FA', '#A9D5FC', '#DCEEFD'], dark: ['#0B48A6', '#2B7FDB', '#4F97E6'], sd: '58px', sy: '74px', sx: '38px', orb: 'linear-gradient(180deg,#FFF1B0,#FFD86E)'},
 {key: 'afternoon', name: 'Afternoon', at: '16:30', note: 'lower and more golden',
  light: ['#8EC3F2', '#D9DDD8', '#F9DCA8'], dark: ['#1D4B94', '#6F6AA0', '#C98A4F'], sd: '124px', sy: '30px', sx: '-24px', orb: 'linear-gradient(180deg,#FFDD7C,#FBAB62 75%,#F8925E)'},
 {key: 'sunset', name: 'Sunset', at: '19:00', note: 'a red sliver going down',
  light: ['#9A9BDC', '#E2B3BE', '#F8B79A'], dark: ['#2A1B6B', '#A23E72', '#E0683F'], sd: '150px', sy: '-36px', sx: '-30px', orb: 'linear-gradient(180deg,#FFB868,#F4705C 55%,#E85C62)'},
 {key: 'night', name: 'Night', at: '22:00', note: 'a moon in place of the sun', moon: true,
  light: ['#B9BFE6', '#D6D5EE', '#ECE7F1'], dark: ['#070A1C', '#0C1030', '#080A1A'], sd: '48px', sy: '74px', sx: '44px'},
];

function phone(t, mode, top) {
  const v = {...base, ...(mode === 'dark' ? D : L), sky: sky(...t[mode], mode === 'dark' ? '#000000' : '#FBF8F3'),
    sd: t.sd, sy: t.sy, sx: t.sx, orb: t.orb || 'none', moon: mode === 'dark' ? '#E9E6FF' : '#FFFFFF'};
  const style = Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';');
  const row = (icon, name, sub, mins) => `<div class="rowp">${ic(icon, 20)}<div class="nm"><b>${name}</b>${sub ? `<small>${sub}</small>` : ''}</div><div class="mn">${mins}${ic('chev', 16)}</div></div>`;
  return `<div class="phone has-sky split ${top ? 'crop' : ''}" style="${style}">
    <div class="sky"></div>
    <div class="body">
      <div class="top"><b>Today</b><span class="place">${ic('place', 17)}Commercial gym</span></div>
      <h1>Chest, lats and front shoulders day</h1>
      <div class="statsi"><div><b>2</b><span>exercises</span></div><div><b>6</b><span>sets</span></div><div><b>35</b><span>minutes</span></div></div>
      <div class="rankwrap"><div class="suncut ${t.moon ? 'moon' : ''}"><div class="orb"></div></div><div class="card rank"><div class="row"><span class="chip">${ic('shield', 13)}Bronze</span><span class="n">905</span><span class="to">95 to Silver</span></div><div class="bar"><i></i></div></div></div>
      <div class="fig"><img src="${document.getElementById('f-sun').src}" alt=""><div class="cap"><span>Working chest, lats and front shoulders</span><span class="link">Change</span></div></div>
      <div class="planh"><span>${ic('list', 16)}Plan</span><span class="link" style="display:flex;gap:6px;align-items:center">${ic('shuffle', 16)}Shuffle</span></div>
      <div class="card plan">
        ${row('flame', 'Warm-up', '', '5 min')}
        ${row('weight', 'Dumbbell pullover', '10 kg · 3 × 13 to 18', '8 min')}
        ${row('weight', 'Machine shoulder press', '20 kg · 3 × 13 to 18', '7 min')}
      </div>
    </div>
    <div class="dock">
      <div class="lr"><span>Energy</span><div class="seg"><span>Easy</span><span class="on">Normal</span><span>Hard</span></div></div>
      <div class="lr"><span>Time</span><div class="slider"><i></i><u></u></div><span class="mins">35 min</span></div>
      <div class="btn">${ic('play', 18)}Start workout</div>
    </div>
    <div class="nav"><div class="on">${ic('cal', 22)}Today</div><div>${ic('trend', 22)}Progress</div><div>${ic('bell', 22)}Exercises</div><div>${ic('sliders', 22)}Settings</div></div>
  </div>`;
}

const morning = times[1];
document.getElementById('board').innerHTML = `
  <section class="dir"><h3>The combined theme</h3><p>Dawn's sky and sun at the top of Today, over Night sun's colours: a warm white page with white cards, or true black, with heavy type and the sun as the button. Shown at 9:00.</p>
    <div class="pair">${phone(morning, 'light')}${phone(morning, 'dark')}</div></section>
  <section class="dir"><h3>Through the day</h3><p>Only the sky and the sun change. The theme decides how bright the sky is, the time decides its colour and where the sun sits.</p>
    <div class="cols"><span>Light theme</span><span>Dark theme</span></div>
    <div class="times">${times.map(t => `<div><h4>${t.name} · ${t.at}<span>${t.note}</span></h4><div class="pair">${phone(t, 'light', true)}${phone(t, 'dark', true)}</div></div>`).join('')}</div></section>`;
</script>
</body></html>
