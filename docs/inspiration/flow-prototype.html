<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;500&family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.ph{--bg:#F6F6F6;--surface:#FCFCFC;--sunk:#EDEDED;--line:#D4D4D4;--ink:#1B1B1B;--ink2:#555;--ink3:#696969;--acc:#456938;--acct:#426635;--accs:#E6F3E2;--accl:#AEC6A6;--on:#FAFAFA;--scrim:rgba(0,0,0,.32)}
.ph[data-mode=dark]{--bg:#141414;--surface:#1C1C1C;--sunk:#080808;--line:#383838;--ink:#EEE;--ink2:#9E9E9E;--ink3:#909090;--acc:#86AB7A;--acct:#87A87C;--accs:#1E281A;--accl:#394A34;--on:#1B1B1B;--scrim:rgba(0,0,0,.55)}
body{margin:0;font-family:var(--font-sans,system-ui),sans-serif;color:var(--foreground)}
.stage{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ph{width:360px;height:760px;flex:none;border-radius:34px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-family:'Wix Madefor Text',var(--font-sans,system-ui),sans-serif;font-size:14px;line-height:1.45;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ph *{box-sizing:border-box}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0;font-size:12px;font-weight:600}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:6px;padding:6px 12px 8px 16px;min-height:52px;flex:none}
.h24{font-family:'Albert Sans',var(--font-sans,system-ui),sans-serif;font-size:24px;font-weight:500;letter-spacing:-.4px;line-height:1.25}
.h34{font-family:'Albert Sans',var(--font-sans,system-ui),sans-serif;font-size:32px;font-weight:500;letter-spacing:-.9px;line-height:1.1}
.h18{font-family:'Albert Sans',var(--font-sans,system-ui),sans-serif;font-size:18px;font-weight:500;letter-spacing:-.2px;line-height:1.3}
.big{font-family:'Albert Sans',var(--font-sans,system-ui),sans-serif;font-size:52px;font-weight:300;letter-spacing:-1.8px;line-height:1}
.sm{font-size:13px;color:var(--ink2);line-height:1.4}
.xs{font-size:12px;color:var(--ink3);line-height:1.35}
.lbl{font-size:13px;font-weight:500;color:var(--ink2)}
.acc{color:var(--acct)}
.body{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:.6px solid var(--line);border-radius:14px}
.sunk{background:var(--sunk);border-radius:12px;padding:10px 12px}
.dock{flex:none;border-top:.6px solid var(--line);padding:8px 16px 16px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn{height:52px;border-radius:26px;border:none;background:var(--acc);color:var(--on);font:500 15px 'Wix Madefor Text',var(--font-sans);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;flex:none}
.btn.out{background:var(--surface);color:var(--ink);border:.6px solid var(--line)}
.btn.tall{height:60px;font-size:16px}
.ib{width:44px;height:44px;border-radius:22px;border:.6px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib.flat{border:none;background:none}
.tb{background:none;border:none;color:var(--acct);font:500 14px 'Wix Madefor Text',var(--font-sans);cursor:pointer;padding:8px 6px;display:inline-flex;gap:6px;align-items:center}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px} svg.i.xs{width:14px;height:14px}
.seg{display:flex;border:.6px solid var(--line);border-radius:20px;overflow:hidden;flex:1}
.seg button{flex:1;height:40px;border:none;background:var(--surface);color:var(--ink);font:500 13px 'Wix Madefor Text',var(--font-sans);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;border-left:.6px solid var(--line);padding:0 4px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accs);color:var(--acct)}
.row{display:flex;align-items:center;gap:10px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;border:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--surface);transition:left .15s}
.sw.on{background:var(--acc)} .sw.on::after{left:21px;background:var(--on)}
input[type=range]{flex:1;accent-color:var(--acc);height:28px;margin:0;min-width:0}
.ctl{display:flex;align-items:center;gap:10px;min-height:40px}
.ctl .k{width:62px;flex:none;font-size:13px;font-weight:500;color:var(--ink2)}
.ctl .v{min-width:64px;text-align:right;font-size:16px;font-weight:500;color:var(--acct)}
.hint{font-size:12px;color:var(--acct);display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:.6px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:none}
.list .it:hover{background:var(--sunk)}
.num{width:26px;height:26px;border-radius:13px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink2);flex:none}
.tag{font-size:11px;font-weight:600;color:var(--acct);background:var(--accs);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.meter{display:flex;gap:4px;flex:1;align-items:center}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.meter i.f{background:var(--acc)} .meter i.cur{height:7px;background:var(--accl)} .meter i.cur.f{background:var(--acc)}
.dots{display:flex;gap:10px}
.dot{width:44px;height:44px;border-radius:22px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--ink3)}
.dot.done{border:none;background:var(--acc);color:var(--on)} .dot.next{border:1.5px solid var(--acc);color:var(--acct)}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;padding:10px 0 20px;max-height:82%;overflow:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .hd{padding:0 20px 8px}
.opt{display:flex;gap:14px;align-items:center;padding:11px 20px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.ibadge{width:40px;height:40px;border-radius:12px;background:var(--accs);color:var(--acct);display:flex;align-items:center;justify-content:center;flex:none}
.ibadge.s{width:34px;height:34px;border-radius:10px}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--line);flex:none}
.radio.on{border:6px solid var(--acc)}
.fig{display:flex;gap:0;flex:none}
.fig canvas{height:156px;width:auto;display:block}
.key{display:flex;gap:10px;font-size:11px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tl{display:flex;gap:2px;height:10px;margin:8px 0 4px}
.tl i{border-radius:3px;height:100%;display:block}
.optcard{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:10px;cursor:pointer}
.optcard:hover{border-color:var(--acc)}
.strip{display:flex;gap:3px;height:20px}
.sg{border:none;border-radius:5px;background:var(--line);padding:0;position:relative;overflow:hidden;cursor:pointer;min-width:8px}
.sg.done{background:var(--acc)} .sg.skip{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.sg.cur{background:var(--accl);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc)}
.sg i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);display:block}
.striplab{display:flex;gap:3px;margin-top:5px}
.striplab span{font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:8px}
.striplab span.on{color:var(--acct);font-weight:600}
.state{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:12px 14px;margin-top:12px}
.state b{font-family:'Albert Sans',var(--font-sans);font-size:30px;font-weight:300;letter-spacing:-.8px}
.state .stl{font-weight:600;font-size:15px}.state .sts{font-size:12px;color:var(--ink3);margin-top:1px}
.state.work{background:var(--acc);color:var(--on)} .state.work .sts{color:var(--on);opacity:.8}
.rbar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--acc)}
.setbar{display:flex;gap:2px;height:8px;margin-top:10px}
.setbar i{display:block;height:100%;border-radius:2px;min-width:2px}
.setbar .w,.setkey .w{background:var(--acc)} .setbar .r,.setkey .r{background:var(--accl)} .setbar .c,.setkey .c{background:repeating-linear-gradient(135deg,var(--ink3) 0 1.5px,transparent 1.5px 4px)}
.sg .tick{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--bg);opacity:.85}
.setkey{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--ink2)}
.setkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.guide{border-radius:16px;padding:14px 16px;margin-top:14px;background:var(--sunk);transition:background .25s}
.guide .gt{font-family:'Albert Sans',var(--font-sans);font-size:19px;font-weight:500;letter-spacing:-.3px;line-height:1.25;margin-bottom:6px}
.guide .gs{font-size:12.5px;color:var(--ink2);line-height:1.4}
.guide b{font-family:'Albert Sans',var(--font-sans);font-size:30px;font-weight:300;letter-spacing:-.8px;line-height:1}
.guide.work{background:var(--acc);color:var(--on)} .guide.work .gs{color:var(--on);opacity:.85}
.reps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.reps button{height:40px;border-radius:12px;border:.6px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px 'Wix Madefor Text',var(--font-sans);cursor:pointer;padding:0}
.reps button.low{color:var(--ink3)}
.reps button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn:disabled{background:var(--sunk);color:var(--ink3);cursor:default}
.btn.lit{box-shadow:0 0 0 0 var(--accl);animation:lit 1.8s ease-out 2}
@keyframes lit{0%{box-shadow:0 0 0 0 var(--accl)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sg.cur.rest i{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,transparent 2px 5px)}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.side{flex:1;min-width:230px;max-width:340px;display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:1.5}
.side h3{margin:0 0 2px;font-size:15px;font-weight:600}
.side .m{color:var(--muted-foreground)}
.side .grp{display:flex;flex-direction:column;gap:5px}
.pseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;align-self:flex-start}
.pseg button{border:none;background:transparent;color:var(--foreground);padding:5px 11px;font:inherit;cursor:pointer;border-left:1px solid var(--border)}
.pseg button:first-child{border-left:none}
.pseg button.on{background:var(--secondary);color:var(--secondary-foreground);font-weight:600}
.psw{width:40px;height:24px;border-radius:12px;border:none;background:var(--border);position:relative;cursor:pointer;flex:none;padding:0}
.psw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:var(--background);transition:left .15s}
.psw.on{background:var(--primary)}.psw.on::after{left:19px;background:var(--primary-foreground)}
.pbtn{border:1px solid var(--border);background:transparent;color:var(--foreground);border-radius:8px;padding:5px 11px;font:inherit;cursor:pointer;align-self:flex-start}
.side ul{margin:0;padding-left:18px} .side li{margin:3px 0}
</style></head><body>
<div class="stage">
  <div class="ph" id="ph"></div>
  <div class="side" id="side"></div>
</div>

 {k:'Hard',icon:'b3',line:'The next level on the hardest two. Prove it and it becomes your normal.',tag:'next level'}
];
const WARM_MOVES=['Arm circles · 30 s','Band pull-aparts · 15','Easy push-ups · 10','Cat-cow · 30 s','Shoulder dislocates · 10'];
const COOL_MOVES=['Doorway chest stretch · 45 s a side','Overhead triceps stretch · 30 s a side','Cross-body shoulder · 30 s a side','Child\'s pose · 60 s'];
const OPTS={
 order:{t:'Order',o:[['seq','One at a time','Every set of one exercise, then the next.'],['circuit','Circuit','One set of each, round and round, with a rest between rounds.']]},
 warm:{t:'Warm-up',o:[[0,'None','Straight into the first exercise.'],[3,'3 minutes, easy','A few moves to get warm.'],[5,'5 minutes, easy','The usual.'],[8,'8 minutes, full routine','For cold mornings and stiff days.']]},
 cool:{t:'Cool-down',o:[[0,'None','Finish after the last set.'],[5,'Stretch, 5 minutes','For the muscles you worked today.'],[10,'Walk and stretch, 10 minutes','An easy walk, then the stretches.']]}
};

// ---------- state ----------
let S, simT=0, speed=30, themePref='auto', timerId=null;

function fresh(){ return {restAuto:S?S.restAuto:false,pct:S?S.pct:false,screen:'today',energy:1,limit:true,minutes:45,count:SETTINGS.ideal,order:'seq',warm:5,cool:5,
  slots:['bench','incline','dips','ohp','lateral','pushup'],learned:S?S.learned:{},sheet:null,run:null,result:null}; }
S=fresh();

// ---------- helpers ----------
const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const mins=s=>Math.max(1,Math.round(s/60));
function tod(sec,ampm=true){const t=18*3600+30*60+Math.floor(sec);let h=Math.floor(t/3600)%24,m=Math.floor(t%3600/60);const ap=h>=12?' pm':' am';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ampm?ap:''}`;}
const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function step(e){return e.dumb?2:2.5;}
function kgFor(id,mode){const e=EX[id],st=step(e);let kg=e.kg;if(mode==='light')kg=Math.round(kg*.85/st)*st;if(mode==='next')kg+=st;return kg;}
function level(id,mode){const e=EX[id];if(e.bw)return e.bw[mode==='light'?0:mode==='next'?2:1];return `${kgFor(id,mode)} kg`+(e.dumb?' dumbbells':'');}
function setupText(id,mode){const e=EX[id];return e.setup.replace('{kg}',e.bw?'':`${kgFor(id,mode)} kg`);}
function warmText(id,mode){const e=EX[id];if(!e.warm)return null;const kg=kgFor(id,mode);return e.warm.map(([r,f])=>`${r} × ${Math.round(kg*f/2.5)*2.5} kg`).join(', then ');}
function defEst(id){const e=EX[id];const rest=e.hi<=8?150:e.hi<=12?90:60;return (e.bar?90:60)+(e.warm?120:0)+3*(3*e.hi+rest);}
function est(id){return S.learned[id]??defEst(id);}

function plan(){
 const order=S.slots, wu=S.warm*60, cd=S.cool*60;
 let picks=[];
 if(S.limit){
  let budget=S.minutes*60-wu-cd; if(S.energy===0) budget*=2/3;
  let used=0; for(const id of order){const s=est(id); if(used+s<=budget){picks.push(id);used+=s;} if(picks.length>=SETTINGS.max)break;}
  if(!picks.length) picks=[order.reduce((a,b)=>est(a)<est(b)?a:b)];
  picks=order.filter(id=>picks.includes(id));
 } else picks=order.slice(0,S.count);
 const modes={}; const hardOnes=[...picks].sort((a,b)=>(EX[b].hard||0)-(EX[a].hard||0)).slice(0,2);
 for(const id of picks) modes[id]=S.energy===0?'light':S.energy===2&&hardOnes.includes(id)?'next':'work';
 const lift=picks.reduce((a,id)=>a+est(id),0);
 return {picks,modes,lift,total:lift+wu+cd,wu,cd,sets:picks.length*3};
}
function musclesOf(picks){const m={};for(const id of picks)for(const [k,v] of Object.entries(EX[id].m))m[k]=Math.max(m[k]||0,v);return m;}

// ---------- figure ----------
const IMG={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
async function initFig(){
 for(const side of ['front','back']){
  const f=FIGSRC[side];const [b,ids]=await Promise.all([loadImg(f.base),loadImg(f.ids)]);if(!b||!ids)continue;
  const w=b.naturalWidth,h=b.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.drawImage(b,0,0);const base=x.getImageData(0,0,w,h);x.clearRect(0,0,w,h);x.drawImage(ids,0,0);
  IMG[side]={w,h,base,ids:x.getImageData(0,0,w,h).data,names:f.names};
 }
 paintFigs();
}
function paintFigs(){
 document.querySelectorAll('canvas[data-side]').forEach(cv=>{
  const F=IMG[cv.dataset.side];if(!F)return;const hl=JSON.parse(cv.dataset.hl);
  cv.width=F.w;cv.height=F.h;const out=new ImageData(new Uint8ClampedArray(F.base.data),F.w,F.h),d=out.data,M=[69/182,105/182,56/182];
  for(let p=0;p<d.length;p+=4){const id=F.ids[p];if(!id)continue;const a=hl[F.names[id]];if(!a)continue;for(let c=0;c<3;c++)d[p+c]=d[p+c]*(1-a+a*M[c]);}
  cv.getContext('2d').putImageData(out,0,0);
 });
}
function figHTML(today){
 const hl={};for(const [k]of Object.entries(RECENT))hl[k]=1/3;for(const [k,v]of Object.entries(today))hl[k]=v>=1?1:2/3;

// ---------- session ----------
// Two words, used the same way everywhere. Lifting is a set: from "I'm ready" until the reps are in. Rest is everything
// between sets: from the reps until "I'm ready", which covers catching your breath, moving to the next exercise and
// setting it up. An item on the strip runs from when it starts until the next one does.
const ROUND_REST=90;
function buildRun(){
 const p=plan(), blocks=[];
 if(p.wu) blocks.push({kind:'warm',label:'Warm-up',short:'Warm-up',est:p.wu});
 if(S.order==='seq') p.picks.forEach(id=>blocks.push({kind:'ex',id,ids:[id],rounds:3,mode:p.modes[id],label:EX[id].n,short:EX[id].n.split(' ')[0],est:est(id),log:[],workAt:null}));
 else blocks.push({kind:'circuit',ids:p.picks,rounds:3,label:'Circuit',short:'Circuit',est:p.lift+2*ROUND_REST,log:[],workAt:null});
 if(p.cd) blocks.push({kind:'cool',label:'Cool-down',short:'Cool-down',est:p.cd});
 blocks.forEach(b=>{b.startAt=null;b.skipped=false;});blocks[0].startAt=simT;if(blocks[0].log)blocks[0].workAt=simT;
 return {t0:simT,blocks,cur:0,picks:p.picks,modes:p.modes,reps:Object.fromEntries(p.picks.map(id=>[id,[null,null,null]])),
  planned:Object.fromEntries(p.picks.map(id=>[id,est(id)])),plannedTotal:p.total};
}
const isLift=B=>!!B.log;
const total=B=>B.ids.length*B.rounds;
function nextSet(B){const k=B.log.length;if(k>=total(B))return null;const n=B.ids.length;return {k,id:B.ids[k%n],r:Math.floor(k/n),pos:k%n};}
function prevIdx(R){let j=R.cur-1;while(j>0&&R.blocks[j].skipped)j--;return j;}
// Moving to an item starts it; a lifting item starts lifting straight away, since "I'm ready" is what brought you there.
function goTo(j){
 const R=S.run;
 if(j>=R.blocks.length){finishRun(null);return;}
 if(j<0||j===R.cur)return;
 if(j>R.cur){for(let k=R.cur+1;k<j;k++)R.blocks[k].skipped=true;const b=R.blocks[j];b.startAt=simT;b.skipped=false;if(isLift(b)&&nextSet(b))b.workAt=simT;R.blocks[R.cur].workAt=null;}
 else for(let k=j+1;k<=R.cur;k++){R.blocks[k].startAt=null;R.blocks[k].skipped=false;if(R.blocks[k].log)R.blocks[k].workAt=null;}
 R.cur=j;render();
}
function ready(){const R=S.run,B=R.blocks[R.cur];if(isLift(B)&&nextSet(B)&&B.workAt==null){B.workAt=simT;render();return;}goTo(R.cur+1);}
function logReps(n){
 const R=S.run,B=R.blocks[R.cur];
 if(B.workAt!=null){const nx=nextSet(B);B.log.push({id:nx.id,reps:n,s:B.workAt,e:simT});B.workAt=null;R.reps[nx.id][nx.r]=n;}
 else if(B.log.length){const k=B.log.length-1,l=B.log[k];l.reps=n;R.reps[l.id][Math.floor(k/B.ids.length)]=n;}
 render();
}
function lastEnd(B){return B.log.length?B.log[B.log.length-1].e:B.startAt;}
function restFor(id){const e=EX[id];return e.hi<=8?150:e.hi<=12?90:60;}
// What comes after the rest before set k: the same exercise again (or the next round), or a different exercise to set up.
function gapType(B,k){const n=B.ids.length;return n===1||k%n===0?'r':'move';}
function gapPlan(B,k){const n=B.ids.length;return B.kind==='circuit'&&k%n===0?ROUND_REST:restFor(B.ids[k%n]);}
function segs(B,end){const out=[];let t=B.startAt;
 B.log.forEach(l=>{if(l.s>t)out.push(['r',t,l.s]);out.push(['w',l.s,l.e]);t=l.e;});
 if(B.workAt!=null){if(B.workAt>t)out.push(['r',t,B.workAt]);out.push(['w',B.workAt,end]);}
 else if(end>t)out.push(['r',t,end]);
 return out;}
function split(B,end){const s={w:0,r:0};for(const [k,a,b] of segs(B,end))s[k]+=Math.max(0,b-a);return s;}
const KIND={w:'Lifting',r:'Rest'};
// Lifting and rest as minutes or as a share, by the setting.
function amounts(s){const tot=s.w+s.r||1;return ['w','r'].map(k=>`${KIND[k]} ${S.pct?Math.round(s[k]/tot*100)+' %':fmt(s[k])}`);}
const lower=x=>x[0].toLowerCase()+x.slice(1);
function keyHTML(s){const a=amounts(s);return `<div class="setkey">${['w','r'].map((k,i)=>`<span><i class="${k}"></i>${a[i]}</span>`).join('')}</div>`;}
function setBarInner(B){const sg=segs(B,simT),tot=Math.max(1,simT-B.startAt);
 return `<div class="setbar">${sg.map(([k,x,y])=>`<i class="${k}" style="flex:${Math.max(y-x,tot*.012)}"></i>`).join('')}</div>${keyHTML(split(B,simT))}`;}
function nextItemLine(R){const n=R.blocks[R.cur+1];if(!n)return 'Finish when you\'ve caught your breath';
 if(n.kind==='ex'){const w=warmText(n.id,n.mode);return `Next: ${n.label.toLowerCase()}. ${setupText(n.id,n.mode)}${w?`, warm up ${w}`:''}`;}
 if(n.kind==='circuit')return `Next: the circuit. ${n.ids.map(id=>EX[id].n).join(' → ')}`;
 return `Next: ${n.label.toLowerCase()}`;}
function guideCard(kind,title,sub,since,bar=''){
 return `<div class="guide ${kind}"><div class="gt">${title}</div><div class="row" style="align-items:flex-end"><div style="flex:1;min-width:0"><div class="gs">${sub}</div>${bar}</div>${since!=null?`<b class="live" data-since="${since}">${fmt(simT-since)}</b>`:''}</div></div>`;}
// The guide: what to do right now.
function guide(R,B){
 if(B.workAt!=null){const nx=nextSet(B),e=EX[nx.id],md=R.modes[nx.id];
  const tip=md==='light'?`Lighter today: ${e.lo} to ${e.hi} reps, nothing judged`:md==='next'?`The next level: ${e.lo} reps on every set makes it yours`:`${e.lo} to ${e.hi} reps, as many as you can with good form`;
  return guideCard('work','Go give it your best!',tip,B.workAt);}
 const nx=nextSet(B),from=lastEnd(B);let sub,bar='';
 if(nx&&gapType(B,nx.k)==='r'){const plan=gapPlan(B,nx.k),what=B.kind==='circuit'?`round ${nx.r+1}`:`set ${nx.k+1}`;
  sub=S.restAuto?`${cap(what)} starts by itself at ${fmt(plan)}`:`About ${fmt(plan)} is plenty before ${what}`;
  bar=`<div class="rbar"><i data-rstart="${from}" data-rlen="${plan}" style="width:${Math.min(100,(simT-from)/plan*100)}%"></i></div>`;}
 else if(nx){const w=warmText(nx.id,R.modes[nx.id]);sub=`Next: ${EX[nx.id].n.toLowerCase()}. ${setupText(nx.id,R.modes[nx.id])}${w?`, warm up ${w}`:''}`;}
 else sub=`That's every set. ${nextItemLine(R)}`;
 return guideCard('rest','Rest up and let us know when you\'re ready',sub,from,bar);}

// --- the timeline ---
function stripHTML(R){
 const seg=R.blocks.map((b,i)=>{const cur=i===R.cur,st=i<R.cur?(b.skipped?'skip':'done'):cur?'cur':'';
  const prog=cur?Math.min(1,(simT-b.startAt)/b.est):0,mode=cur&&isLift(b)?(b.workAt!=null?'lift':'rest'):'';
  const ticks=b.kind==='circuit'?Array.from({length:b.rounds-1},(_,x)=>`<span class="tick" style="left:${(x+1)/b.rounds*100}%"></span>`).join(''):'';
  return `<button class="sg ${st} ${mode}" style="flex:${b.est}" data-act="jump" data-arg="${i}" title="${b.label}"><i data-pstart="${cur?b.startAt:''}" data-pest="${b.est}" style="width:${prog*100}%"></i>${ticks}</button>`;}).join('');
 const lab=R.blocks.map((b,i)=>{const cur=i===R.cur;return `<span style="flex:${b.est}" class="${cur?'on':''}">${b.short}${cur&&isLift(b)?(b.workAt!=null?' · lifting':' · resting'):''}</span>`;}).join('');
 return `<div class="strip">${seg}</div><div class="striplab">${lab}</div>`;
}

// --- the current item ---
function blockBody(R,B){
 if(!isLift(B)){const warm=B.kind==='warm',mn=warm?S.warm:S.cool,end=B.startAt+mn*60,moves=warm?WARM_MOVES:COOL_MOVES;
  return `<div class="sm" style="margin-top:2px">${B.label} · ${mn} minutes</div><div class="big live" data-until="${end}" style="margin:12px 0 14px">${fmt(end-simT)}</div>
   <div class="card">${moves.map((m,i)=>`<div style="padding:8px 14px;${i?'border-top:.6px solid var(--line)':''}">${m}</div>`).join('')}</div>
   ${warm?guideCard('rest','Warm up, then let us know when you\'re ready',nextItemLine(R)):guideCard('rest','Stretch it out','The workout ends when the timer does, or tap Finish')}`;}
 const nx=nextSet(B),n=B.ids.length,lifting=B.workAt!=null,last=B.log[B.log.length-1];
 const showId=lifting||!last?nx.id:last.id,e=EX[showId],md=R.modes[showId];
 const k=B.log.length,done=lifting?k:k-1,r=Math.floor(Math.max(0,done)/n);
 const head=B.kind==='ex'?(lifting?`Set ${k+1} of 3`:k?`Set ${k} of 3 done`:'Set 1 of 3'):(lifting?`Round ${nx.r+1} of ${B.rounds} · ${nx.pos+1} of ${n}`:k?`Round ${Math.floor((k-1)/n)+1} of ${B.rounds} · ${(k-1)%n+1} of ${n} done`:`Round 1 of ${B.rounds}`);
 const dots=B.kind==='ex'?[0,1,2].map(j=>B.log[j]?B.log[j].reps:null):B.ids.map((x,j)=>B.log[r*n+j]?B.log[r*n+j].reps:null);
 const at=lifting?(B.kind==='ex'?nx.k:nx.pos):-1;
 return `<div class="sm" style="margin-top:2px">${head}</div><div class="h34" style="margin:4px 0 2px">${e.n}</div>
  <div class="h18 acc" style="margin-bottom:12px">${level(showId,md)}</div>
  <div class="dots">${dots.map((x,j)=>`<div class="dot ${x!=null?'done':j===at?'next':''}">${x!=null?x:j+1}</div>`).join('')}</div>
  ${B.kind==='circuit'?`<div class="xs" style="margin-top:6px">${B.ids.map(id=>EX[id].n).join(' → ')}, then rest and go again.</div>`:''}
  ${guide(R,B)}<div id="setbar">${setBarInner(B)}</div>`;
}
function sessionScr(){
 const R=S.run,B=R.blocks[R.cur];
 const key=`s${R.cur}`,anim=document.getElementById('ph').dataset.key!==key;document.getElementById('ph').dataset.key=key;
 const top=`<div class="bar" style="gap:10px;min-height:46px"><span class="sm" style="display:flex;gap:5px;align-items:center">${ic('clock','xs')}<span class="live" data-since="${R.t0}">${fmt(simT-R.t0)}</span></span><div style="flex:1"></div>
  <button class="tb" data-act="end">${ic('stop','xs')}End</button></div>`;
 return top+`<div style="padding:0 16px 10px;flex:none">${stripHTML(R)}</div><div class="body ${anim?'fade':''}">${blockBody(R,B)}</div>`+dockHTML(R,B);
}
function readyLabel(R,B){
 const nx=isLift(B)?nextSet(B):null;
 if(nx){if(!B.log.length)return `I'm ready · ${EX[nx.id].n.toLowerCase()}`;return gapType(B,nx.k)==='r'?(B.kind==='circuit'?`I'm ready · round ${nx.r+1}`:`I'm ready · set ${nx.k+1}`):`I'm ready · ${EX[nx.id].n.toLowerCase()}`;}
 const n=R.blocks[R.cur+1];return n?`I'm ready · ${n.label.toLowerCase()}`:'Finish';}
function dockHTML(R,B){
 const nl=R.blocks[R.cur+1],back=R.cur>0?`<button class="tb" style="color:var(--ink2)" data-act="back">${ic('back','s')}${R.blocks[prevIdx(R)].label}</button>`:'<span></span>';
 const nav=`<div class="row" style="justify-content:space-between">${back}<button class="tb" style="color:var(--ink2)" data-act="skip">${nl?'Skip':'End'} ${ic('fwd','s')}</button></div>`;
 if(!isLift(B))return `<div class="dock"><button class="btn tall" data-act="ready">${B.kind==='cool'?`${ic('check','s')}Finish`:readyLabel(R,B)}</button>${nav}</div>`;
 const lifting=B.workAt!=null,last=B.log[B.log.length-1],id=lifting?nextSet(B).id:last?last.id:null;
 let picker='';
 if(id){const e=EX[id],sel=lifting?null:last.reps,lo=Math.max(1,e.lo-3),hi=e.hi+3,nums=[];for(let v=lo;v<=hi;v++)nums.push(v);
  picker=`<div class="lbl" style="text-align:center">${lifting?'How many reps did you get?':`Set ${B.log.length}: ${sel} reps. Tap another number to fix it.`}</div>
   <div class="reps">${nums.map(v=>`<button class="${v===sel?'on':''} ${v<e.lo?'low':''}" data-act="reps" data-arg="${v}">${v}</button>`).join('')}</div>`;}
 const btn=lifting?`<button class="btn tall" disabled>${readyLabel(R,{...B,log:[...B.log,{}],workAt:null})}</button><div class="xs" style="text-align:center;margin-top:-2px">Put in your reps to finish the set</div>`
  :`<button class="btn tall lit" data-act="ready">${readyLabel(R,B)}</button>`;
 return `<div class="dock">${picker}${btn}${nav}</div>`;
}
function finishRun(reason){
 const R=S.run;R.endAt=simT;R.reason=reason||null;
 const started=R.blocks.filter(b=>b.startAt!=null).sort((a,b)=>a.startAt-b.startAt),chunks=[];
 started.forEach((b,i)=>{const end=i<started.length-1?started[i+1].startAt:R.endAt;chunks.push({b,dur:end-b.startAt});});
 S.result={chunks,skipped:R.blocks.filter(b=>b.skipped).map(b=>b.label),total:R.endAt-R.t0,planned:R.planned,plannedTotal:R.plannedTotal,reps:R.reps,picks:R.picks,modes:R.modes};
 S.run=null;S.sheet=null;S.screen=reason==='none'?'done':'feel';render();
}
function feelScr(){
 const o=[['feather','Easy','Twice in a row and spare minutes add exercises again.'],['check','About right','Nothing changes.'],['flame','Too much','Twice in a row and spare minutes go to cardio instead.']];
 return `<div class="bar"><div class="h24">How was it?</div></div><div class="body fade"><div class="sm" style="margin-bottom:18px">Optional. One tap, or skip.</div>
  ${o.map(x=>`<div class="card optcard" data-act="go" data-arg="done"><div class="ibadge">${ic(x[0])}</div><div style="flex:1"><div class="h18" style="font-size:16px">${x[1]}</div><div class="xs">${x[2]}</div></div></div>`).join('')}
  <div style="text-align:center"><button class="tb" data-act="go" data-arg="done">Skip</button></div></div>`;
}
function doneScr(){
 const r=S.result,mx=Math.max(...r.chunks.map(c=>c.dur),1),all={w:0,r:0};
 r.chunks.forEach(c=>{if(!c.b.log)return;c.s=split(c.b,c.b.startAt+c.dur);for(const k in all)all[k]+=c.s[k];});
 const any=r.chunks.some(c=>c.b.log);
 const repLines=r.picks.filter(id=>r.reps[id].some(x=>x!=null)).map(id=>`${EX[id].n}: ${r.reps[id].filter(x=>x!=null).join(', ')}`);
 const first=r.chunks.find(c=>c.b.kind==='ex');
 const bar=s=>`<div class="setbar">${['w','r'].map(k=>`<i class="${k}" style="flex:${s[k]+.01}"></i>`).join('')}</div>`;
 return `<div class="bar"><div class="h24">Logged.</div></div><div class="body fade">
  <div class="big" style="font-size:44px;margin:4px 0 2px">${fmt(r.total)}</div><div class="sm" style="margin-bottom:12px">planned about ${mins(r.plannedTotal)} min</div>
  ${any?`<div class="card" style="padding:10px 14px;margin-bottom:14px"><div class="lbl">On exercises</div>${bar(all)}${keyHTML(all)}</div>`:''}
  <div class="lbl" style="margin-bottom:6px">Where the time went</div>
  <div class="card" style="padding:6px 14px">${r.chunks.map(c=>`<div style="padding:8px 0"><div class="row"><span style="flex:1">${c.b.label}</span><b style="font-weight:600">${fmt(c.dur)}</b></div>
   ${c.s?`<div style="margin-top:6px">${bar(c.s)}</div><div class="xs" style="margin-top:4px">${amounts(c.s).map(lower).join(' · ')}${c.b.kind==='ex'?` · planned ${mins(r.planned[c.b.id])} min`:''}</div>`
     :`<div style="height:5px;border-radius:3px;background:var(--sunk);margin-top:5px"><div style="height:100%;width:${Math.max(2,c.dur/mx*100)}%;border-radius:3px;background:var(--accl)"></div></div>`}</div>`).join('')}</div>
  ${r.skipped&&r.skipped.length?`<div class="xs" style="margin-top:8px">Skipped: ${list(r.skipped)}</div>`:''}
  ${repLines.length?`<div class="sm" style="margin-top:12px">${repLines.join('<br>')}</div>`:''}
  ${first?`<div class="hint" style="margin-top:12px">${ic('info','xs')}<span>Next time ${first.b.label.toLowerCase()} is planned from this: it took ${fmt(first.dur)} against ${mins(r.planned[first.b.id])} min.</span></div>`:''}
 </div><div class="dock"><button class="btn" data-act="finishdone">Done</button></div>`;
}

// ---------- sheets ----------
function sheetHTML(){
 const sh=S.sheet;if(!sh)return '';let inner='';
 if(sh.t==='ex'){const p=plan(),id=p.picks[sh.i],e=EX[id],alt=EX[e.alt];
  inner=`<div class="hd"><div class="h18">${e.n}</div><div class="xs">${level(id,p.modes[id])} · 3 × ${e.lo}–${e.hi} · about ${mins(est(id))} min</div></div>
   <div class="opt" data-act="swap" data-arg="${sh.i}"><div class="ibadge s">${ic('shuffle','s')}</div><div style="flex:1">Swap for ${alt.n}<div class="xs">${alt.bw?alt.bw[1]:`${alt.kg} kg${alt.dumb?' dumbbells':''}`} · works the same muscles</div></div></div>
   ${sh.i>0?`<div class="opt" data-act="move" data-arg="${sh.i},-1"><div class="ibadge s">${ic('up','s')}</div><div>Move up</div></div>`:''}
   ${sh.i<p.picks.length-1?`<div class="opt" data-act="move" data-arg="${sh.i},1"><div class="ibadge s">${ic('down','s')}</div><div>Move down</div></div>`:''}`;}
 if(sh.t==='opt'){const O=OPTS[sh.k];inner=`<div class="hd"><div class="h18">${O.t}</div></div>`+O.o.map(o=>`<div class="opt" data-act="set" data-arg="${sh.k},${o[0]}"><div class="radio ${S[sh.k]===o[0]?'on':''}"></div><div style="flex:1">${o[1]}<div class="xs">${o[2]}</div></div></div>`).join('');}
 if(sh.t==='end'){const o=[['hand','Just stop','No reason needed. Nothing is judged.','none'],['b1','Out of energy','Levels hold. Tomorrow defaults a little easier.','energy'],['clock','Out of time','Levels hold. The minutes you had become the default.','time'],['bandage','Something hurts','This exercise and similar ones rest for a week.','pain']];
  inner=`<div class="hd"><div class="h18">End the workout?</div><div class="xs">What you've done is kept either way.</div></div>`+o.map(x=>`<div class="opt" data-act="endwith" data-arg="${x[3]}"><div class="ibadge">${ic(x[0])}</div><div style="flex:1">${x[1]}<div class="xs">${x[2]}</div></div></div>`).join('');}
 return `<div class="sheet-bg" data-act="close"><div class="sheet fade" data-stop="1"><div class="grab"></div>${inner}</div></div>`;
}

// ---------- render ----------
function render(){
 const ph=document.getElementById('ph');const sc=ph.querySelector('.body');const keep=sc?sc.scrollTop:0;const keepScreen=ph.dataset.screen;
 let html='';
 if(S.screen==='today')html=today();else if(S.screen==='plan')html=planScr();else if(S.screen==='session')html=sessionScr();else if(S.screen==='feel')html=feelScr();else html=doneScr();
 ph.innerHTML=statusBar()+`<div class="scr">${html}</div>`+sheetHTML();ph.dataset.screen=S.screen;
 const nb=ph.querySelector('.body');if(nb&&keepScreen===S.screen)nb.scrollTop=keep;
 paintFigs();renderSide();
}
function renderSide(){
 document.getElementById('side').innerHTML=`<div><h3>Prototype</h3><div class="m">Today → Plan → the workout → How was it → Logged. Tap through it like the app.</div></div>
 <div class="grp"><span class="m">Clock speed</span><div class="pseg">${[1,10,30,60].map(v=>`<button class="${speed===v?'on':''}" data-pact="speed" data-arg="${v}">${v}×</button>`).join('')}</div></div>
 <div class="grp"><span class="m">Theme</span><div class="pseg">${['auto','light','dark'].map(v=>`<button class="${themePref===v?'on':''}" data-pact="theme" data-arg="${v}">${cap(v)}</button>`).join('')}</div></div>
 <div class="grp"><span class="m">Settings to try</span><span class="m" style="font-size:12px">Lifting is a set: from I'm ready until your reps are in. Rest is everything between sets: catching your breath, moving to the next exercise and setting it up.</span></div>

 <div class="grp"><span class="m">When rest runs out</span><div class="pseg"><button class="${S.restAuto?'':'on'}" data-pact="rest" data-arg="keep">Keep resting</button><button class="${S.restAuto?'on':''}" data-pact="rest" data-arg="auto">Start the next set</button></div><span class="m" style="font-size:12px">${S.restAuto?'The planned rest is a timer: when it ends, the next set or round starts as if you had tapped I\'m ready.':'Rest counts up for as long as you like. The planned time is only a guide.'}</span></div>
 <div class="grp"><span class="m">Show lifting and rest as</span><div class="pseg"><button class="${S.pct?'':'on'}" data-pact="pct" data-arg="min">Minutes</button><button class="${S.pct?'on':''}" data-pact="pct" data-arg="pct">Share of time</button></div><span class="m" style="font-size:12px">${S.pct?'Each as a percentage of the time on exercises.':'Each in minutes and seconds.'}</span></div>
 <button class="pbtn" data-pact="reset">Start over</button>
 <div class="grp"><span class="m">Worth trying</span><ul class="m">
  <li>Skip ahead by tapping a later part of the strip, then go back.</li>
  <li>Turn the time limit off and use the exercise slider.</li>
  <li>Switch energy and watch the weights and list change.</li>
  <li>Put in your reps, rest, then tap I'm ready: watch the guide and the lifting / rest bar change.</li>
  <li>Switch the order to Circuit on Plan: one item on the strip, rest between exercises and between rounds.</li>
  <li>Finish a workout, then plan again: the minutes come from what you did.</li></ul></div>
 <div class="m" style="font-size:12px">The exercises, weights and history are made up. The body figure is the app's real art; the colours are the design system's. The energy names are placeholders.</div>`;
}
function syncTheme(){
 let mode=themePref;
 if(mode==='auto'){const c=document.createElement('canvas').getContext('2d');c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--background').trim()||'#fff';c.fillRect(0,0,1,1);const [r,g,b]=c.getImageData(0,0,1,1).data;mode=(0.2126*r+0.7152*g+0.0722*b)<128?'dark':'light';}
 document.getElementById('ph').dataset.mode=mode;
}

// ---------- events ----------
const A={
 energy:a=>{S.energy=+a;render();}, limit:()=>{S.limit=!S.limit;render();},
 go:a=>{S.screen=a;S.sheet=null;render();},
 reshuffle:()=>{S.slots=S.slots.map(id=>Math.random()<.5?EX[id].alt:id);render();},
 ex:a=>{S.sheet={t:'ex',i:+a};render();}, opt:a=>{S.sheet={t:'opt',k:a};render();},
 swap:a=>{const p=plan(),id=p.picks[+a],j=S.slots.indexOf(id);S.slots[j]=EX[id].alt;S.sheet=null;render();},
 move:a=>{const [i,dir]=a.split(',').map(Number),p=plan(),x=S.slots.indexOf(p.picks[i]),y=S.slots.indexOf(p.picks[i+dir]);[S.slots[x],S.slots[y]]=[S.slots[y],S.slots[x]];S.sheet=null;render();},
 set:a=>{const [k,v]=a.split(',');S[k]=k==='order'?v:+v;S.sheet=null;render();},
 close:()=>{S.sheet=null;render();},
 start:()=>{S.run=buildRun();S.screen='session';render();},
 ready:()=>ready(), reps:a=>logReps(+a), skip:()=>goTo(S.run.cur+1), back:()=>goTo(prevIdx(S.run)), jump:a=>goTo(+a),





 end:()=>{S.sheet={t:'end'};render();}, endwith:a=>finishRun(a), finish:()=>finishRun(null),
 finishdone:()=>{const r=S.result;for(const c of r.chunks)if(c.b.kind==='ex'){const old=S.learned[c.b.id]??defEst(c.b.id);S.learned[c.b.id]=Math.round(old*.5+c.dur*.5);}S.result=null;S.screen='today';render();}
};
document.addEventListener('click',e=>{
 const pa=e.target.closest('[data-pact]');
 if(pa){const a=pa.dataset.pact,v=pa.dataset.arg;if(a==='speed')speed=+v;if(a==='rest')S.restAuto=v==='auto';if(a==='pct')S.pct=v==='pct';if(a==='theme'){themePref=v;syncTheme();}if(a==='reset'){S=fresh();S.learned={};simT=0;}render();return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.act==='close'&&e.target.closest('[data-stop]'))return;
 A[el.dataset.act]?.(el.dataset.arg);
});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;S[k]=+e.target.value;updateToday();});

// ---------- clock ----------
let last=performance.now();
setInterval(()=>{
 const now=performance.now();simT+=(now-last)/1000*speed;last=now;
 document.querySelectorAll('[data-clock]').forEach(x=>x.textContent=tod(simT,false));
 document.querySelectorAll('[data-since]').forEach(x=>x.textContent=fmt(simT-+x.dataset.since));
 document.querySelectorAll('[data-until]').forEach(x=>x.textContent=fmt(+x.dataset.until-simT));
 const R=S.run;if(!R||S.sheet)return;const B=R.blocks[R.cur];
 document.querySelectorAll('[data-pstart]').forEach(x=>{if(x.dataset.pstart!=='')x.style.width=Math.min(100,(simT-+x.dataset.pstart)/+x.dataset.pest*100)+'%';});
 document.querySelectorAll('[data-rstart]').forEach(x=>x.style.width=Math.min(100,(simT-+x.dataset.rstart)/+x.dataset.rlen*100)+'%');
 const sb=document.getElementById('setbar');if(sb&&isLift(B))sb.innerHTML=setBarInner(B);
 if(S.restAuto&&isLift(B)&&B.workAt==null&&B.log.length){const nx=nextSet(B);if(nx&&gapType(B,nx.k)==='r'){const due=lastEnd(B)+gapPlan(B,nx.k);if(simT>=due){B.workAt=due;render();}}}
 if(B.kind==='cool'&&B.startAt!=null&&simT>=B.startAt+S.cool*60)finishRun(null);
},200);


// ---------- test driver (#drive=act:arg|wait:ms|...) ----------
(async()=>{const m=location.hash.match(/drive=([^&]*)/);if(!m)return;const steps=decodeURIComponent(m[1]).split('|');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));await sleep(400);
 for(const s of steps){const [a,...rest]=s.split(':');const arg=rest.join(':');
  if(a==='wait'){await sleep(+arg);continue;}
  if(a==='speed'){speed=+arg;renderSide();continue;}
  if(a==='tl'){S.tl=arg;render();continue;}

  if(a==='pct'){S.pct=true;render();continue;}
  if(a==='restauto'){S.restAuto=true;render();continue;}
  if(a==='theme'){themePref=arg;syncTheme();continue;}
  if(a==='range'){const [k,v]=arg.split('=');S[k]=+v;render();continue;}
  if(A[a])A[a](arg||undefined);else console.log('no action',a);await sleep(120);}
 console.log('drive done',S.screen);})();

syncTheme();render();initFig();
new MutationObserver(()=>{if(themePref==='auto')syncTheme();}).observe(document.documentElement,{attributes:true});
</script></body></html>
