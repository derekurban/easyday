<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Easyday</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/du/styles.css">
<link rel="stylesheet" href="styles.css">
<script src="vendor/lucide.min.js"></script>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<nav id="nav" hidden>
  <button data-act="nav" data-arg="today"><i data-lucide="play"></i>Today</button>
  <button data-act="nav" data-arg="exercises"><i data-lucide="library"></i>Exercises</button>
  <button data-act="nav" data-arg="progress"><i data-lucide="trending-up"></i>Progress</button>
  <button data-act="nav" data-arg="settings"><i data-lucide="settings"></i>Settings</button>
</nav>
<div id="sheet-root" hidden><div class="backdrop" data-act="sheet-close"></div><div class="sheet" id="sheet"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
