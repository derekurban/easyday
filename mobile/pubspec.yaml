name: fitness
description: "A new Flutter project."
publish_to: 'none'
version: 0.13.4+18

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  lucide_icons_flutter: ^3.1.25
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/muscle/
  fonts:
    - family: Albert Sans
      fonts:
        - asset: assets/fonts/AlbertSans-300.ttf
          weight: 300
        - asset: assets/fonts/AlbertSans-400.ttf
          weight: 400
        - asset: assets/fonts/AlbertSans-500.ttf
          weight: 500
        - asset: assets/fonts/AlbertSans-600.ttf
          weight: 600
    - family: Wix Madefor Text
      fonts:
        - asset: assets/fonts/WixMadeforText-400.ttf
          weight: 400
        - asset: assets/fonts/WixMadeforText-500.ttf
          weight: 500
        - asset: assets/fonts/WixMadeforText-600.ttf
          weight: 600
