# Every push to the staging branch builds the staging flavour, signs it with the release key and publishes it as a
# GitHub pre-release tagged v<version>-staging.<versionCode>. The staging app's Settings > Updates panel finds it there;
# prod reads releases/latest, which never returns a pre-release, so prod installs are untouched.
#
# versionCode = pubspec build number * 1000 + this workflow's run number (mod 1000), so every staging build installs
# over the previous one, and over any local staging build of the same pubspec version.
#
# A pull request into staging runs the same build as a check, without releasing. Once this file is on the default
# branch, Actions > staging > Run workflow also builds any branch, releasing only if "release" is ticked.
name: staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub pre-release
        type: boolean
        default: false

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          full="$(grep -E '^version:' pubspec.yaml | sed 's/version: *//')"
          name="${full%%+*}"
          base="${full##*+}"
          code=$(( base * 1000 + GITHUB_RUN_NUMBER % 1000 ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-staging.$code" >> "$GITHUB_OUTPUT"
          echo "staging $name build $code"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build
        run: |
          flutter build apk --release --flavor staging --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-staging-release.apk "$RUNNER_TEMP/fitness-staging.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fitness-staging-${{ steps.version.outputs.code }}
          path: ${{ runner.temp }}/fitness-staging.apk

      - name: Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev="$(git tag --list 'v*-staging.*' --sort=-creatordate | head -1)"
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="-n 15 HEAD"; fi
          {
            echo "Staging build ${{ steps.version.outputs.code }} from \`${GITHUB_SHA::7}\` on ${GITHUB_REF_NAME}."
            echo
            git log $range --no-merges --format='- %s' | head -30
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/fitness-staging.apk" --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
